server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native          # use local filesystem, no Git required in dev
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/your-org/hivemind-config}
          default-label: main
          clone-on-start: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
